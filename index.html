<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北陸鐵道三日</title>
<meta name="description" content="大阪出發，搭雷鳥號與北陸新幹線，金澤・雨晴海岸・富山・敦賀三天兩夜大眾交通行程。">
<meta property="og:title" content="北陸鐵道三日｜金澤・雨晴海岸・富山・敦賀">
<meta property="og:description" content="大阪出發的三天兩夜北陸鐵道行程，含實際班次、轉乘與周遊券建議。">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang TC","Helvetica Neue","Microsoft JhengHei",sans-serif;
  --paper:#f6f1e7; --card:#fffdf8; --ink:#1d2433; --muted:#5d6577; --line:#e3dacb;
  --indigo:#1f3a5f; --gold:#b8892b; --gold-soft:#f3e6c4; --sea:#2f6f86; --warn:#9a3b1f; --warn-soft:#f8e3d8;
  --shadow:0 1px 2px rgba(29,36,51,.06),0 8px 24px rgba(29,36,51,.06);
}
:root[lang="ja"]{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN","Helvetica Neue","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151d; --card:#171c26; --ink:#e9e4da; --muted:#a3abba; --line:#2a3140;
    --indigo:#9fbbe0; --gold:#e0b55a; --gold-soft:#2e2717; --sea:#7fc1d6; --warn:#f0a58a; --warn-soft:#33221b;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#11151d; --card:#171c26; --ink:#e9e4da; --muted:#a3abba; --line:#2a3140;
  --indigo:#9fbbe0; --gold:#e0b55a; --gold-soft:#2e2717; --sea:#7fc1d6; --warn:#f0a58a; --warn-soft:#33221b;
  --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.75 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--sea)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--font);line-height:1.3;margin:0}

/* language switch */
.lang{position:fixed;top:12px;right:12px;z-index:20;display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.lang button{font:600 13px/1 var(--font);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:8px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--indigo);color:var(--paper)}

/* hero */
header.hero{padding:56px 0 32px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:13px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.hero h1{font-size:clamp(34px,8vw,56px);font-weight:900;margin:8px 0 12px;color:var(--indigo)}
.hero h1 span{color:var(--gold)}
.hero p.lede{color:var(--muted);margin:0;max-width:36em}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px}
.stat b{color:var(--indigo)}

/* route map */
.map{margin:28px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.map svg{width:100%;height:auto;display:block}
.map svg text{font-family:var(--font)}
.map figcaption{font-size:13px;color:var(--muted);padding:4px 6px 2px}

/* nav */
nav.days{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.days .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
nav.days a{flex:none;text-decoration:none;color:var(--ink);font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
nav.days a:hover{border-color:var(--gold)}

section{padding:40px 0 8px;scroll-margin-top:56px}
.sec-title{font-size:13px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin-bottom:6px}

/* day */
.day-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.day-no{font-weight:900;font-size:44px;color:var(--gold);line-height:1}
.day-head h2{font-size:clamp(22px,5vw,28px);color:var(--indigo)}
.drive{color:var(--muted);font-size:14px;margin:4px 0 18px}
.stay{display:inline-block;background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:2px 10px;font-size:14px;margin-left:4px}

.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:58px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:52px 1fr;gap:20px;padding:0 0 18px}
.tl time{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--indigo);text-align:right;padding-top:14px}
.tl li::after{content:"";position:absolute;left:53px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--gold)}
.tl li.move::after{border-color:var(--sea);background:var(--sea);width:8px;height:8px;left:55px;top:22px}
.stop{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow)}
.tl li.move time{padding-top:10px}
.tl li.move .stop{background:transparent;border:1px dashed var(--line);box-shadow:none;color:var(--muted);font-size:15px;padding:8px 14px}
.tl li.move .stop strong{color:var(--ink)}
.stop h3{font-size:18px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.stop p{margin:6px 0 0;font-size:15px}
.tag{font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--gold-soft);color:var(--ink)}
.tag.opt{background:transparent;border:1px solid var(--line);color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--muted)}
.meta a{text-decoration:none;font-weight:500}
.daytip{margin-left:72px}
.tip{margin-top:8px;font-size:14px;background:var(--gold-soft);border-radius:8px;padding:6px 10px}

/* variant */
.variant{margin:4px 0 0 72px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sea);border-radius:12px;padding:12px 16px}
.variant h3{font-size:17px;color:var(--sea);margin-bottom:6px}
.variant ol{margin:0;padding-left:20px;font-size:15px}
.variant ol li{margin:2px 0}
.variant p{margin:8px 0 0;font-size:14px;color:var(--muted)}

/* notes */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.note h3{font-size:16px;color:var(--indigo);margin-bottom:4px}
.note p,.note ul{margin:0;font-size:15px;color:var(--ink)}
.note ul{padding-left:18px}
.note.key{background:var(--gold-soft);border-color:transparent}

footer{padding:40px 0 56px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
@media (max-width:480px){
  .tl::before{left:46px}
  .tl li{grid-template-columns:40px 1fr;gap:18px}
  .tl li::after{left:41px}
  .tl li.move::after{left:43px}
  .tl time{font-size:13px}
  .variant,.daytip{margin-left:0}
}
@media print{nav.days,.lang{display:none}.stop,.note,.map{box-shadow:none}}
</style>
</head>

function stopHTML(it){
  if (it.move) return `<li class="move"><time>${it.t}</time><div class="stop">🚆 ${L(it.p)}</div></li>`;
  const meta = (it.meta||[]).map(m=>`<span>${L(m)}</span>`).join('');
  return `<li><time>${it.t}</time><div class="stop">
    <h3>${L(it.h)} <span class="tag${it.opt?' opt':''}">${L(it.tag)}</span></h3>
    <p>${L(it.p)}</p>
    <div class="meta">${meta}<a href="${gmap(it.q)}" target="_blank" rel="noopener">${L(UI.mapLink)}</a></div>
    ${it.tip?`<div class="tip">${L(it.tip)}</div>`:''}
  </div></li>`;
}

function dayHTML(d){
  const v = d.variant ? `<div class="variant"><h3>✨ ${L(d.variant.h)}</h3><ol>${L(d.variant.steps).map(s=>`<li>${s}</li>`).join('')}</ol><p>${L(d.variant.note)}</p></div>` : '';
  return `<section id="${d.id}">
    <div class="day-head"><span class="day-no">${d.no}</span><h2>${L(d.title)}</h2></div>
    <p class="drive">${L(d.route)}${d.stay?`<span class="stay">${L(d.stay)}</span>`:''}</p>
    <ol class="tl">${d.items.map(stopHTML).join('')}</ol>
    ${d.tip?`<div class="tip daytip">${L(d.tip)}</div>`:''}
    ${v}
  </section>`;
}

function noteHTML(n){
  return `<div class="note${n.key?' key':''}"><h3>${L(n.h)}</h3>
    ${n.p?`<p>${L(n.p)}</p>`:''}
    ${n.ul?`<ul>${L(n.ul).map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    ${n.p2?`<p style="margin-top:6px">${L(n.p2)}</p>`:''}</div>`;
}

function render(){
  document.documentElement.lang = lang==='ja' ? 'ja' : 'zh-Hant-TW';
  document.title = L(UI.title);
  document.querySelector('meta[name=description]').content = L(UI.desc);
  const h1 = L(UI.h1);
  const nav = L(UI.nav);
  document.getElementById('app').innerHTML = `
  <header class="hero"><div class="wrap">
    <div class="eyebrow">${UI.eyebrow}</div>
    <h1>${h1[0]}<span>${h1[1]}</span></h1>
    <p class="lede">${L(UI.lede)}</p>
    <div class="stats">${UI.stats.map(s=>`<span class="stat">${L(s)}</span>`).join('')}</div>
    <figure class="map">${mapSVG()}<figcaption>${L(UI.mapCap)}</figcaption></figure>
  </div></header>
  <nav class="days" aria-label="Itinerary"><div class="wrap">
    <a href="#day1">${nav[0]}</a><a href="#day2">${nav[1]}</a><a href="#day3">${nav[2]}</a><a href="#notes">${nav[3]}</a>
  </div></nav>
  <main class="wrap">
    ${DAYS.map(dayHTML).join('')}
    <section id="notes"><div class="sec-title">${L(UI.notesEyebrow)}</div><h2>${L(UI.notesTitle)}</h2>
      <div class="grid">${NOTES.map(noteHTML).join('')}</div></section>
  </main>
  <footer><div class="wrap">${L(UI.footer)}</div></footer>`;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===lang));
}

let lang = 'zh';
try {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = localStorage.getItem('lang');
  lang = (q==='ja'||q==='zh') ? q : (saved==='ja'?'ja':'zh');
} catch(e){}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch(e){}
  try { const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null,'',u); } catch(e){}
  render();
}));
render();
</script>
